<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoSubmit · Manage</title>
  <link rel="icon" href="../icons/icon32.png">
  <link rel="stylesheet" href="manage.css">
</head>
<body>
  <aside class="side">
    <div class="side-brand">
      <img src="../icons/logo.svg" alt="">
      <span>AutoSubmit</span>
      <select id="lang" class="lang" aria-label="Language"></select>
    </div>
    <nav>
      <a class="nav-item active" href="#links">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.6 13.4a1 1 0 0 1 0-1.4l3.5-3.5a1 1 0 1 1 1.4 1.4L12 13.4a1 1 0 0 1-1.4 0Zm-2.1 6.4a4.5 4.5 0 0 1-3.2-7.7l2.1-2.1a1 1 0 0 1 1.4 1.4l-2.1 2.1a2.5 2.5 0 0 0 3.5 3.5l2.1-2.1a1 1 0 0 1 1.4 1.4l-2.1 2.1a4.5 4.5 0 0 1-3.1 1.4Zm7-5.3a1 1 0 0 1-.7-1.7l2.1-2.1a2.5 2.5 0 0 0-3.5-3.5l-2.1 2.1a1 1 0 1 1-1.4-1.4L12 5.8a4.5 4.5 0 0 1 6.4 6.4l-2.1 2.1a1 1 0 0 1-.8.2Z"/></svg>
        <span data-i18n="linkManagement"></span>
      </a>
    </nav>
    <p class="side-note" data-i18n="localOnly"></p>
  </aside>

  <main class="main">
    <div class="panel">
      <div class="toolbar">
        <h1 data-i18n="linkManagement"></h1>
        <div class="tools">
          <button class="mbtn danger" id="deleteSelected" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 2h4v2H4V5h4l1-2Zm-3 6h12l-1 12H7L6 9Z"/></svg>
            <span data-i18n="deleteSelected"></span>
          </button>
          <button class="mbtn outlined" id="export">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20h14v-2H5v2Zm7-16-5.5 5.5 1.4 1.4L11 7.8V16h2V7.8l3.1 3.1 1.4-1.4L12 4Z"/></svg>
            <span data-i18n="exportLinks"></span>
          </button>
          <button class="mbtn outlined" id="import">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20h14v-2H5v2Zm7-4 5.5-5.5-1.4-1.4L13 12.2V4h-2v8.2L7.9 9.1l-1.4 1.4L12 16Z"/></svg>
            <span data-i18n="importLinks"></span>
          </button>
          <button class="mbtn contained" id="add">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5Z"/></svg>
            <span data-i18n="addLink"></span>
          </button>
          <input type="file" id="importFile" accept="application/json,.json" hidden>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="c-check"><input type="checkbox" id="checkAll" aria-label="Select all"></th>
              <th class="c-logo" data-i18n="logo"></th>
              <th data-i18n="name"></th>
              <th data-i18n="url"></th>
              <th data-i18n="tags"></th>
              <th data-i18n="email"></th>
              <th data-i18n="description"></th>
              <th class="c-act" data-i18n="actions"></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <p class="empty" id="empty" data-i18n="emptyTable" hidden></p>
      </div>
    </div>
  </main>

  <dialog id="dialog">
    <form id="form" method="dialog" novalidate>
      <header class="dlg-head">
        <h2 id="dlgTitle"></h2>
        <button type="button" class="x" id="dlgClose" aria-label="Close">×</button>
      </header>
      <div class="dlg-body">
        <div class="grid2">
          <label class="fld"><span><span data-i18n="name"></span> *</span><input name="name" required maxlength="120"></label>
          <label class="fld"><span><span data-i18n="url"></span> *</span><input name="url" type="url" required placeholder="https://"></label>
          <label class="fld"><span data-i18n="email"></span><input name="email" type="email" placeholder="support@example.com"></label>
          <label class="fld"><span data-i18n="tags"></span><input name="tags" data-i18n-ph="phTags"></label>
        </div>
        <label class="fld"><span data-i18n="tagline"></span><input name="tagline" maxlength="200" data-i18n-ph="phTagline"></label>
        <label class="fld"><span data-i18n="description"></span><textarea name="description" rows="4"></textarea></label>
        <div class="grid2">
          <label class="fld"><span data-i18n="useCases"></span><textarea name="useCases" rows="4" data-i18n-ph="phUseCases"></textarea></label>
          <label class="fld"><span data-i18n="features"></span><textarea name="features" rows="4" data-i18n-ph="phFeatures"></textarea></label>
        </div>
        <div class="grid2">
          <div class="fld img-fld" data-img="logo">
            <span data-i18n="logo"></span>
            <div class="img-box logo-box"><img alt="" hidden><em data-i18n="imgTip"></em></div>
            <div class="img-actions">
              <button type="button" class="mbtn outlined sm" data-act="pick" data-i18n="upload"></button>
              <button type="button" class="mbtn text sm" data-act="clear" data-i18n="remove"></button>
              <input type="file" accept="image/*" hidden>
            </div>
          </div>
          <div class="fld img-fld" data-img="hero">
            <span data-i18n="heroImage"></span>
            <div class="img-box hero-box"><img alt="" hidden><em data-i18n="imgTip"></em></div>
            <div class="img-actions">
              <button type="button" class="mbtn outlined sm" data-act="pick" data-i18n="upload"></button>
              <button type="button" class="mbtn text sm" data-act="clear" data-i18n="remove"></button>
              <input type="file" accept="image/*" hidden>
            </div>
          </div>
        </div>
        <p class="err" id="formErr" hidden></p>
      </div>
      <footer class="dlg-foot">
        <button type="button" class="mbtn text" id="dlgCancel" data-i18n="cancel"></button>
        <button type="submit" class="mbtn contained" data-i18n="save"></button>
      </footer>
    </form>
  </dialog>

  <div class="snack" id="snack" hidden></div>

  <script src="i18n.js"></script>
  <script src="store.js"></script>
  <script src="manage.js"></script>
</body>
</html>
