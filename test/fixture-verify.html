<!doctype html>
<html>
<head><meta charset="utf-8"><title>Code Site</title></head>
<body>
  <h1>Code Site</h1>

  <!-- 1. sign up -->
  <div id="step1">
    <form id="signup">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email">
      <label for="password">Password</label>
      <input id="password" name="password" type="password">
      <button type="submit">Create account</button>
    </form>
  </div>

  <!-- 2. the code from the mail -->
  <div id="step2" hidden>
    <p>Enter the verification code sent to your email</p>
    <input id="code" name="code" autocomplete="one-time-code" inputmode="numeric" maxlength="6">
    <button id="verify" type="button">Verify</button>
  </div>

  <!-- 3. the submission form -->
  <div id="step3" hidden>
    <form id="tool">
      <label for="toolName">Tool name</label>
      <input id="toolName" name="toolName">
      <label for="website">Website URL</label>
      <input id="website" name="website" type="url">
      <label for="about">Description</label>
      <textarea id="about" name="about"></textarea>
      <button type="submit">Submit Tool</button>
    </form>
  </div>

  <script>
    const CODE = '483921';
    document.getElementById('signup').addEventListener('submit', (e) => {
      e.preventDefault();
      document.getElementById('step1').hidden = true;
      document.getElementById('step2').hidden = false;
    });
    document.getElementById('verify').addEventListener('click', () => {
      if (document.getElementById('code').value.trim() !== CODE) {
        document.getElementById('step2').innerHTML = '<p>That code is not right.</p>';
        return;
      }
      document.getElementById('step2').hidden = true;
      document.getElementById('step3').hidden = false;
    });
    document.getElementById('tool').addEventListener('submit', (e) => {
      e.preventDefault();
      const f = e.target;
      localStorage.setItem('submitted', JSON.stringify({
        email: document.getElementById('email').value,
        code: CODE,
        toolName: f.toolName.value,
        website: f.website.value,
        about: f.about.value,
      }));
      document.getElementById('step3').innerHTML = '<p>Your tool has been submitted for review.</p>';
    });
  </script>
</body>
</html>
